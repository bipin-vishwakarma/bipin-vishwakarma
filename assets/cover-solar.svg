<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 132" width="480" height="132" fill="none" role="img" aria-label="CSS Solar System Explorer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="480" y2="132" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#080e11"/><stop offset="1" stop-color="#0a1a1e"/></linearGradient>
    <radialGradient id="gl" cx="0.14" cy="0.5" r="0.42"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.14"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <style>.planet{transform-origin:58px 66px;animation:orbit 7s linear infinite}@keyframes orbit{to{transform:rotate(360deg)}}</style>
  </defs>
  <rect x="0.75" y="0.75" width="478.5" height="130.5" rx="13" fill="url(#bg)" stroke="#a78bfa" stroke-opacity="0.3" stroke-width="1.25"/>
  <rect x="0.75" y="0.75" width="4" height="130.5" rx="2" fill="#a78bfa"/><ellipse cx="60" cy="66" rx="80" ry="60" fill="url(#gl)"/>
  <circle cx="58" cy="66" r="12" fill="#fbbf24" fill-opacity="0.9"/><ellipse cx="58" cy="66" rx="34" ry="20" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.8"/>
  <g class="planet"><circle cx="92" cy="66" r="5" fill="#a78bfa"/></g>
  <text x="106" y="55" font-family="'Segoe UI',Verdana,Arial,sans-serif" font-weight="700" font-size="21" fill="#eaf7f9">CSS Solar System</text>
  <text x="107" y="79" font-family="'Consolas','Courier New',monospace" font-weight="500" font-size="12.5" letter-spacing="0.5" fill="#82abb4">HAML  ·  SCSS  ·  No JavaScript</text>
  <circle cx="112" cy="99" r="3" fill="#a78bfa"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/></circle>
  <text x="123" y="103" font-family="'Consolas','Courier New',monospace" font-weight="700" font-size="11" letter-spacing="1.2" fill="#a78bfa">LIVE DEMO</text>
</svg>
